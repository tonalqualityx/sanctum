server {
    listen 80;
    server_name go.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name go.local;

    ssl_certificate     /home/mike/sanctum/ssl/certs/go.local/go.local.pem;
    ssl_certificate_key /home/mike/sanctum/ssl/certs/go.local/go.local-key.pem;

    access_log /var/log/sanctum/sites/go.local-access.log main;
    error_log  /var/log/sanctum/sites/go.local-error.log warn;

    limit_req zone=sanctum burst=20 nodelay;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ~* \.(php|cgi|pl|py|sh)$ {
        return 403;
    }

    location ~ /\. {
        deny all;
    }

    # optional tighter rate limit on admin or login
    location ~* ^/(wp-login\.php|wp-admin/|xmlrpc\.php) {
        limit_req zone=sanctum burst=5 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}