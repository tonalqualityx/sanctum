server {
    listen 80;
    server_name why.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name why.local;

    ssl_certificate     /home/mike/sanctum/ssl/certs/why.local/why.local.pem;
    ssl_certificate_key /home/mike/sanctum/ssl/certs/why.local/why.local-key.pem;

    access_log /var/log/sanctum/sites/why.local-access.log main;
    error_log  /var/log/sanctum/sites/why.local-error.log warn;

    limit_req zone=sanctum burst=20 nodelay;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Block access to hidden files
    location ~ /\. {
        deny all;
    }

    # Block access to sensitive WordPress files
    location ~* /(?:wp-config\.php|readme\.html|license\.txt) {
        deny all;
    }

    # WordPress admin area with tighter rate limiting
    location ~* ^/(wp-login\.php|wp-admin/) {
        limit_req zone=sanctum burst=5 nodelay;
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
    }

    # WordPress content directory
    location ~* ^/wp-content/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # PHP files in wp-includes and wp-content/plugins
    location ~* ^/(wp-includes|wp-content/plugins)/.*\.php$ {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
    }

    # Block PHP in uploads
    location ~* /wp-content/uploads/.*\.php$ {
        deny all;
    }

    # All other requests
    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Deny access to any other PHP files not explicitly allowed above
    location ~* \.php$ {
        deny all;
    }
}